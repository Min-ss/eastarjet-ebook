<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PDF 뷰어 — 이스타항공</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="assets/style.css?v=20260619o" />
<link rel="stylesheet" href="assets/reader.css?v=20260619a" />
  <style>
    /* ---------- PDF 뷰어 전용 ---------- */
    #pdfScroll {
      flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
      padding: 16px 0 40px; background: var(--bg-soft);
      /* 한 손가락 끌기(패닝)·두 손가락 핀치 줌 모두 JS로 처리 */
      touch-action: none;
    }
    /* 페이지 묶음: 확대로 페이지가 화면보다 넓어지면 가로 스크롤 영역을 만들어 줌.
       (페이지에 직접 margin:auto 를 주면 넘친 왼쪽이 스크롤로 닿지 않는 영역이 됨) */
    #pdfStack {
      width: max-content; min-width: 100%;
      margin: 0 auto; padding: 0 12px; box-sizing: border-box;
    }
    .pdf-page {
      position: relative; margin: 0 auto 14px;
      background: #fff; box-shadow: 0 6px 22px rgba(0,0,0,.45);
      width: max-content;
    }
    .pdf-page canvas { display: block; }
    /* PDF.js 텍스트 레이어 (선택·복사·검색용) */
    .textLayer {
      position: absolute; inset: 0; overflow: hidden;
      line-height: 1; opacity: 1; mix-blend-mode: multiply;
    }
    .textLayer span, .textLayer br {
      position: absolute; white-space: pre; cursor: text;
      color: transparent; transform-origin: 0 0;
    }
    .textLayer ::selection { background: rgba(0, 120, 255, .35); }
    .textLayer .hl { background: rgba(255, 215, 0, .45); border-radius: 2px; }
    .pdf-skeleton {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9aa6b8; font-size: 13px; background: #fff;
    }
    /* 검색 바 */
    .findbar {
      display: none; align-items: center; gap: 8px;
      padding: 8px 14px; background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .findbar.show { display: flex; }
    .findbar input {
      flex: 1; min-width: 0; max-width: 360px;
      background: var(--bg-soft); border: 1px solid var(--line);
      color: var(--text); border-radius: 10px; padding: 8px 11px; font-size: 14px; outline: none;
    }
    .findbar .count { color: var(--muted); font-size: 13px; min-width: 64px; text-align: center; }
    .zoom-label { font-size: 13px; color: var(--muted); min-width: 44px; text-align: center; }
    .v-bottom #pageBox {
      width: 54px; text-align: center; background: var(--bg-soft);
      border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 6px 4px; font-size: 14px;
    }
    @media (max-width: 640px) {
      .zoom-label { display: none; }
      .v-top .title { max-width: 30vw; }
    }
    /* 다크 모드: 뷰어 크롬만 어둡게 (페이지 캔버스는 원본 유지) */
    @media (prefers-color-scheme: dark) {
      .findbar { background: rgba(18, 18, 22, .92); }
      .pdf-page { box-shadow: 0 6px 22px rgba(0, 0, 0, .7); }
    }
  </style>
</head>
<body class="viewer">
  <div class="viewer-wrap">
    <!-- 상단 바 -->
    <div class="topbar v-top">
      <a class="btn icon-btn" href="index.html" title="목록으로" aria-label="목록으로">←</a>
      <a href="index.html"><img class="bar-logo" src="assets/eastar_logo.svg" alt="이스타항공" /></a>
      <span class="title" id="bookTitle">불러오는 중…</span>
      <div class="spacer"></div>
      <button class="btn icon-btn" id="findBtn" title="검색" aria-label="검색">🔍</button>
      <button class="btn icon-btn" id="zoomOut" title="축소" aria-label="축소">－</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="btn icon-btn" id="zoomIn" title="확대" aria-label="확대">＋</button>
      <button class="btn icon-btn" id="downloadBtn" title="PDF 다운로드" aria-label="PDF 다운로드">⬇</button>
    </div>

    <!-- 검색 바 -->
    <div class="findbar" id="findbar">
      <input type="search" id="findInput" placeholder="본문에서 검색…" autocomplete="off" />
      <span class="count" id="findCount">—</span>
      <button class="btn icon-btn" id="findPrev" title="이전 결과" aria-label="이전 결과">◀</button>
      <button class="btn icon-btn" id="findNext" title="다음 결과" aria-label="다음 결과">▶</button>
      <button class="btn icon-btn" id="findClose" title="닫기" aria-label="닫기">✕</button>
    </div>

    <!-- PDF 영역 -->
    <div id="pdfScroll"></div>

    <!-- 하단 컨트롤 -->
    <div class="v-bottom">
      <button class="btn icon-btn" id="prevBtn" title="이전 페이지" aria-label="이전 페이지">◀</button>
      <input id="pageBox" type="text" inputmode="numeric" value="1" aria-label="페이지 번호" />
      <span id="pageInfo">/ -</span>
      <button class="btn icon-btn" id="nextBtn" title="다음 페이지" aria-label="다음 페이지">▶</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="books.js"></script>
  <script src="assets/track.js"></script>
  <script src="assets/reader.js?v=20260619a"></script>
  <script>
    const $ = id => document.getElementById(id);
    const toast = (msg) => {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
    };

    // ---------- 책 선택 ----------
    const params = new URLSearchParams(location.search);
    const bookId = params.get('book');
    const book = (window.BOOKS || []).find(b => b.id === bookId);
    if (!book || book.type !== 'pdf') {
      document.body.innerHTML = '<div class="empty-state" style="margin-top:120px"><h2>문서를 찾을 수 없습니다</h2><p><a class="btn" href="index.html">← 서재로 돌아가기</a></p></div>';
      throw new Error('no pdf book');
    }
    document.title = `${book.title} — 이스타항공`;
    if (window.ebTrack) ebTrack.open(book.id);
    $('bookTitle').textContent = book.title;
    const pdfUrl = `${book.path}/${book.file}`;

    // ---------- PDF.js 준비 ----------
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const scrollEl = $('pdfScroll');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let pdf = null, numPages = 0;
    let baseW = 0, baseH = 0;          // 1페이지 기준 크기(스케일 1)
    let zoom = 1;                       // 사용자 배율
    let cssScale = 1;                   // 컨테이너에 맞춘 기본 배율
    let pageGap = 14;                   // 페이지 간격(px) — 읽기 설정 '줄 간격'
    const wrappers = [];               // 페이지 래퍼 div 목록
    const rendered = new Set();        // 그려진 페이지 번호
    const renderTasks = {};            // 진행 중 렌더 취소용
    const textCache = {};              // 검색용 페이지 텍스트 캐시

    function fitScale() {
      // 가용 폭에 1페이지 폭을 맞춤 (좌우 여백 고려), 데스크탑은 최대 900px
      const avail = Math.min(scrollEl.clientWidth - 24, 900);
      return avail / baseW;
    }

    function pageDims() {
      const s = cssScale * zoom;
      return { w: Math.round(baseW * s), h: Math.round(baseH * s), scale: s };
    }

    // 페이지 자리(스켈레톤) 만들기 — 실제 렌더는 화면에 가까워질 때
    function buildPlaceholders() {
      const { w, h } = pageDims();
      scrollEl.innerHTML = '';
      const stack = document.createElement('div');
      stack.id = 'pdfStack';
      scrollEl.appendChild(stack);
      wrappers.length = 0; rendered.clear();
      for (let n = 1; n <= numPages; n++) {
        const div = document.createElement('div');
        div.className = 'pdf-page';
        div.dataset.page = n;
        div.style.width = w + 'px';
        div.style.height = h + 'px';
        div.innerHTML = `<div class="pdf-skeleton">${n} 페이지</div>`;
        stack.appendChild(div);
        wrappers.push(div);
        io.observe(div);
      }
    }

    // 한 페이지 렌더 (캔버스 + 텍스트 레이어)
    async function renderPage(n) {
      if (rendered.has(n)) return;
      rendered.add(n);
      const wrap = wrappers[n - 1];
      try {
        const page = await pdf.getPage(n);
        const { scale } = pageDims();
        const viewport = page.getViewport({ scale });
        // 실제 비율로 높이 보정 (별표 등 다른 크기 대응)
        wrap.style.width = Math.round(viewport.width) + 'px';
        wrap.style.height = Math.round(viewport.height) + 'px';

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width * DPR);
        canvas.height = Math.round(viewport.height * DPR);
        canvas.style.width = Math.round(viewport.width) + 'px';
        canvas.style.height = Math.round(viewport.height) + 'px';
        const ctx = canvas.getContext('2d', { alpha: false });

        const task = page.render({
          canvasContext: ctx,
          viewport,
          transform: DPR !== 1 ? [DPR, 0, 0, DPR, 0, 0] : null,
        });
        renderTasks[n] = task;
        await task.promise;
        delete renderTasks[n];

        wrap.innerHTML = '';
        wrap.appendChild(canvas);

        // 텍스트 레이어 (선택·복사·검색)
        const textContent = await page.getTextContent();
        const tl = document.createElement('div');
        tl.className = 'textLayer';
        // PDF.js 3.x: 텍스트 레이어 정렬을 위해 viewport.scale 과 같은 값으로 설정 필요
        tl.style.setProperty('--scale-factor', viewport.scale);
        wrap.appendChild(tl);
        pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          textContent: textContent,
          container: tl,
          viewport,
          textDivs: [],
        });
      } catch (e) {
        if (e && e.name === 'RenderingCancelledException') { rendered.delete(n); return; }
        wrap.innerHTML = `<div class="pdf-skeleton">${n} 페이지 (불러오기 실패)</div>`;
      }
    }

    function unloadPage(n) {
      if (!rendered.has(n)) return;
      rendered.delete(n);
      if (renderTasks[n]) { try { renderTasks[n].cancel(); } catch (e) {} delete renderTasks[n]; }
      const wrap = wrappers[n - 1];
      if (wrap) wrap.innerHTML = `<div class="pdf-skeleton">${n} 페이지</div>`;
    }

    // 화면 근처 페이지만 렌더, 멀어지면 메모리 해제(648p 대응)
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        const n = +en.target.dataset.page;
        if (en.isIntersecting) renderPage(n);
        else unloadPage(n);
      });
    }, { root: scrollEl, rootMargin: '800px 0px' });

    // ---------- 이어읽기: 책별 마지막 페이지 기억 (flip.html 과 키 공유) ----------
    const POS_KEY = 'eb_pos_' + book.id;
    function savePos(n) { try { localStorage.setItem(POS_KEY, String(n)); } catch (e) {} if (window.ebTrack) ebTrack.page(book.id, n, numPages); if (window.EBReader) EBReader.setProgress(n, numPages); }
    function resumeToast(p) {
      const t = $('toast');
      t.textContent = `${p}페이지부터 이어봅니다 `;
      const b = document.createElement('button');
      b.textContent = '처음부터';
      b.style.cssText = 'margin-left:10px;background:none;border:none;color:#8fc7ff;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit;padding:0';
      b.onclick = () => { goToPage(1); t.classList.remove('show'); };
      t.appendChild(b);
      t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 4500);
    }

    // ---------- 초기 로딩 ----------
    const LOAD_TIMEOUT_MS = 45000;   // 느린 네트워크에서 무한 대기 방지
    (async () => {
      let timedOut = false, timer = 0;
      try {
        scrollEl.innerHTML = '<div class="empty-state" id="loadMsg" style="margin-top:90px">불러오는 중…</div>';
        const task = pdfjsLib.getDocument({
          url: pdfUrl,
          cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
          cMapPacked: true,
        });
        // 다운로드 진행률 표시
        task.onProgress = p => {
          const el = $('loadMsg');
          if (el && p.total) el.textContent = `불러오는 중… ${Math.min(99, Math.round(p.loaded / p.total * 100))}%`;
        };
        timer = setTimeout(() => { timedOut = true; try { task.destroy(); } catch (e) {} }, LOAD_TIMEOUT_MS);
        pdf = await task.promise;
        clearTimeout(timer);
        numPages = pdf.numPages;
        const first = await pdf.getPage(1);
        const vp1 = first.getViewport({ scale: 1 });
        baseW = vp1.width; baseH = vp1.height;
        cssScale = fitScale();
        $('pageInfo').textContent = `/ ${numPages}`;
        $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
        buildPlaceholders();
        if (window.EBReader) EBReader.setProgress(curPage, numPages);
        // 저장된 위치가 있으면 그 페이지로 이동
        const saved = parseInt(localStorage.getItem(POS_KEY) || '0', 10);
        if (saved >= 2 && saved <= numPages) {
          requestAnimationFrame(() => {
            wrappers[saved - 1]?.scrollIntoView({ block: 'start' });
            resumeToast(saved);
          });
        }
      } catch (e) {
        clearTimeout(timer);
        const isFile = location.protocol === 'file:';
        const retryBtn = `<button class="btn primary" onclick="location.reload()" style="margin-right:8px">다시 시도</button>`;
        scrollEl.innerHTML = `<div class="empty-state" style="margin-top:90px">
          <h2>PDF를 불러오지 못했습니다</h2>
          ${isFile
            ? `<p>파일을 더블클릭(<code>file://</code>)으로 열면 브라우저 보안 정책상 PDF를 읽지 못합니다.<br>
               같은 폴더의 <b>「미리보기.bat」</b> 을 실행하거나, GitHub Pages 등 웹주소(http/https)로 열면 정상 동작합니다.</p>
               <p style="margin-top:18px"><a class="btn" href="index.html">← 목록으로</a></p>`
            : `<p>${timedOut ? '연결이 지연되고 있습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.' : (e.message || e)}</p>
               <p style="margin-top:18px">${retryBtn}<a class="btn" href="index.html">← 목록으로</a></p>`}
        </div>`;
      }
    })();

    // ---------- 현재 페이지 추적 ----------
    let curPage = 1;
    function updateCurrent() {
      const mid = scrollEl.scrollTop + scrollEl.clientHeight / 2;
      let acc = 0, p = 1;
      for (let i = 0; i < wrappers.length; i++) {
        const h = wrappers[i].offsetHeight + pageGap;
        if (acc + h > mid) { p = i + 1; break; }
        acc += h; p = i + 1;
      }
      if (p !== curPage) { curPage = p; if (document.activeElement !== $('pageBox')) $('pageBox').value = p; savePos(p); }
    }
    scrollEl.addEventListener('scroll', () => { requestAnimationFrame(updateCurrent); }, { passive: true });

    function goToPage(n) {
      n = Math.max(1, Math.min(numPages, n | 0));
      wrappers[n - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    $('prevBtn').onclick = () => goToPage(curPage - 1);
    $('nextBtn').onclick = () => goToPage(curPage + 1);
    $('pageBox').addEventListener('keydown', e => { if (e.key === 'Enter') { goToPage(+e.target.value); e.target.blur(); } });
    $('pageBox').addEventListener('change', e => goToPage(+e.target.value));

    // ---------- 확대/축소 ----------
    function centerHorizontally() {
      scrollEl.scrollLeft = Math.max(0, (scrollEl.scrollWidth - scrollEl.clientWidth) / 2);
    }
    function applyZoom(z, focal) {
      const anchor = curPage;
      const prev = zoom;
      zoom = Math.max(0.5, Math.min(3, Math.round(z * 100) / 100));
      if (zoom === prev) return;
      const sl = scrollEl.scrollLeft, st = scrollEl.scrollTop;
      cssScale = fitScale();
      $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
      buildPlaceholders();
      if (focal) {
        // 핀치 초점이 가리키던 내용이 화면의 같은 자리에 남도록 스크롤 보정
        const f = zoom / prev;
        scrollEl.scrollLeft = Math.max(0, (sl + focal.x) * f - focal.x);
        scrollEl.scrollTop = Math.max(0, (st + focal.y) * f - focal.y);
      } else {
        centerHorizontally();
        setTimeout(() => { goToPage(anchor); centerHorizontally(); }, 50);
      }
    }
    $('zoomIn').onclick = () => applyZoom(zoom + 0.2);
    $('zoomOut').onclick = () => applyZoom(zoom - 0.2);

    // ---------- 드래그 패닝 + 두 손가락 핀치 줌 ----------
    const pts = new Map();              // 현재 눌린 포인터들
    let drag = null, pinch = null, flingId = 0;

    function fling(vx, vy) {
      // 손가락을 뗀 뒤 관성 스크롤 (px/frame, 매 프레임 5%씩 감속)
      if (Math.abs(vx) < 0.4 && Math.abs(vy) < 0.4) return;
      scrollEl.scrollLeft += vx;
      scrollEl.scrollTop += vy;
      flingId = requestAnimationFrame(() => fling(vx * 0.95, vy * 0.95));
    }

    scrollEl.addEventListener('pointerdown', e => {
      cancelAnimationFrame(flingId);
      if (e.pointerType === 'mouse') {
        if (e.button !== 0) return;
        // 마우스는 텍스트 레이어 위에서 드래그 선택(복사)을 우선
        if (e.target.closest('.textLayer')) return;
      }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { scrollEl.setPointerCapture(e.pointerId); } catch (err) {}
      if (pts.size === 2) {
        // 핀치 시작 — 끝날 때까지 CSS 미리보기, 떼는 순간 실제 재렌더
        drag = null;
        const p = [...pts.values()];
        const r = scrollEl.getBoundingClientRect();
        const fx = (p[0].x + p[1].x) / 2 - r.left, fy = (p[0].y + p[1].y) / 2 - r.top;
        pinch = { d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), f: 1, fx, fy, rect: r, stack: $('pdfStack') };
        if (pinch.stack) pinch.stack.style.transformOrigin =
          (scrollEl.scrollLeft + fx) + 'px ' + (scrollEl.scrollTop + fy) + 'px';
      } else if (pts.size === 1) {
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: 0, vy: 0, t: e.timeStamp };
      }
    });

    scrollEl.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pts.size >= 2) {
        const p = [...pts.values()];
        const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        // 최종 배율이 0.5~3 범위를 벗어나지 않도록 미리보기 단계에서 제한
        pinch.f = Math.max(0.5 / zoom, Math.min(3 / zoom, d / pinch.d0));
        pinch.fx = (p[0].x + p[1].x) / 2 - pinch.rect.left;
        pinch.fy = (p[0].y + p[1].y) / 2 - pinch.rect.top;
        if (pinch.stack) pinch.stack.style.transform = `scale(${pinch.f})`;
      } else if (drag && e.pointerId === drag.id) {
        const dx = drag.x - e.clientX, dy = drag.y - e.clientY;
        scrollEl.scrollLeft += dx;
        scrollEl.scrollTop += dy;
        const dt = Math.max(1, e.timeStamp - drag.t);
        drag.vx = dx / dt * 16; drag.vy = dy / dt * 16;   // px/frame(60fps) 기준 속도
        drag.x = e.clientX; drag.y = e.clientY; drag.t = e.timeStamp;
      }
    });

    ['pointerup', 'pointercancel'].forEach(ev =>
      scrollEl.addEventListener(ev, e => {
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        if (pinch && pts.size < 2) {
          const { f, fx, fy, stack } = pinch;
          pinch = null;
          if (stack) { stack.style.transform = ''; stack.style.transformOrigin = ''; }
          if (Math.abs(f - 1) > 0.05) applyZoom(zoom * f, { x: fx, y: fy });
          // 핀치 후 한 손가락이 남으면 이어서 팬
          if (pts.size === 1) {
            const id = [...pts.keys()][0], pt = pts.get(id);
            drag = { id, x: pt.x, y: pt.y, vx: 0, vy: 0, t: e.timeStamp };
          } else drag = null;
          return;
        }
        if (drag && e.pointerId === drag.id) {
          const { vx, vy, t } = drag;
          drag = null;
          // 멈춘 채로 떼면 관성 없음 (마지막 이동 후 80ms 이상 경과)
          if (ev === 'pointerup' && e.timeStamp - t < 80) fling(vx, vy);
        }
      }));

    // ---------- 다운로드 ----------
    $('downloadBtn').onclick = () => {
      if (window.ebTrack) ebTrack.download(book.id);
      const a = document.createElement('a');
      a.href = pdfUrl; a.download = `${book.title}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
    };
    // 다운로드는 관리자에게만 노출 (일반 방문자는 읽기 전용)
    if (localStorage.getItem('eb_admin') !== '1') $('downloadBtn').style.display = 'none';

    // ---------- 검색 (전체 문서) ----------
    const findbar = $('findbar'), findInput = $('findInput'), findCount = $('findCount');
    let matches = [], matchIdx = -1, indexed = false, indexing = false;

    $('findBtn').onclick = () => { findbar.classList.toggle('show'); if (findbar.classList.contains('show')) findInput.focus(); };
    $('findClose').onclick = () => { findbar.classList.remove('show'); };

    async function buildIndex() {
      if (indexed || indexing) return;
      indexing = true; findCount.textContent = '준비중…';
      for (let n = 1; n <= numPages; n++) {
        if (textCache[n] === undefined) {
          try { const pg = await pdf.getPage(n); const tc = await pg.getTextContent();
            textCache[n] = tc.items.map(i => i.str).join(' ').toLowerCase(); }
          catch (e) { textCache[n] = ''; }
        }
      }
      indexed = true; indexing = false;
    }

    async function runSearch(q) {
      q = q.trim().toLowerCase();
      matches = []; matchIdx = -1;
      if (!q) { findCount.textContent = '—'; return; }
      await buildIndex();
      for (let n = 1; n <= numPages; n++) {
        if (textCache[n] && textCache[n].includes(q)) matches.push(n);
      }
      if (!matches.length) { findCount.textContent = '0건'; toast('검색 결과 없음'); return; }
      matchIdx = 0; jumpMatch();
    }
    function jumpMatch() {
      if (!matches.length) return;
      findCount.textContent = `${matchIdx + 1}/${matches.length} · ${matches[matchIdx]}p`;
      goToPage(matches[matchIdx]);
    }
    let findT;
    findInput.addEventListener('input', e => { clearTimeout(findT); findT = setTimeout(() => runSearch(e.target.value), 350); });
    findInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (matches.length) { matchIdx = (matchIdx + 1) % matches.length; jumpMatch(); } } });
    $('findNext').onclick = () => { if (matches.length) { matchIdx = (matchIdx + 1) % matches.length; jumpMatch(); } };
    $('findPrev').onclick = () => { if (matches.length) { matchIdx = (matchIdx - 1 + matches.length) % matches.length; jumpMatch(); } };

    // ---------- 키보드 / 리사이즈 ----------
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { goToPage(curPage + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goToPage(curPage - 1); }
    });
    let rT;
    window.addEventListener('resize', () => {
      clearTimeout(rT);
      rT = setTimeout(() => { if (!numPages) return; const a = curPage; cssScale = fitScale(); buildPlaceholders(); centerHorizontally(); setTimeout(() => { goToPage(a); centerHorizontally(); }, 50); }, 250);
    });

    // ---------- 읽기 설정(테마·야간·글자크기·줄간격·몰입·진행률) ----------
    if (window.EBReader) EBReader.init({
      features: { font: true, gap: true },
      onFont: (f) => { if (!numPages) { zoom = f; $('zoomLabel').textContent = Math.round(f * 100) + '%'; } else applyZoom(f); },
      onGap: (px) => { pageGap = px; },   // .pdf-page 여백은 reader.css --reader-gap 가 자동 반영, 여기선 현재페이지 계산 보정
      onImmersive: () => { if (!numPages) return; const a = curPage; cssScale = fitScale(); buildPlaceholders(); requestAnimationFrame(() => { goToPage(a); centerHorizontally(); }); }
    });
  </script>
