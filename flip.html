<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>간행물 뷰어 — 이스타항공</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="viewer flipbook">
  <!-- ===== ① 표지 랜딩 + 전체 페이지 미리보기 ===== -->
  <section class="wz-landing" id="landing">
    <div class="topbar v-top">
      <a class="btn icon-btn" href="index.html" title="목록으로">←</a>
      <a href="index.html"><img class="bar-logo" src="assets/eastar_logo.svg" alt="이스타항공" /></a>
      <span class="title" id="bookTitle">불러오는 중…</span>
      <div class="spacer"></div>
      <a class="btn icon-btn" id="searchLink" title="문서 검색 보기">🔍</a>
      <button class="btn icon-btn" id="dlBtn1" title="PDF 다운로드">⬇</button>
    </div>

    <div class="wz-hero">
      <div class="wz-cover">
        <img id="coverImg" alt="표지" />
        <button class="play-btn" id="playBtn" title="열람하기">▶</button>
      </div>
      <div class="wz-info">
        <h1 id="titleBig">　</h1>
        <p class="sub" id="subBig"></p>
        <button class="btn primary" id="openFlip">간행물 열람하기 ›</button>
        <div class="hint">📄 한 장씩 보기가 기본 · 상단 <b>1장 / 2장</b> 으로 펼침 전환<br>🔍 확대: <b>＋</b> 버튼 · 두 손가락 핀치 · 더블탭 &nbsp;|&nbsp; 확대 후 <b>끌어서 이동</b><br>↔ 넘김: 좌우 스와이프 · ◀ ▶ · ← → 키</div>
        <a class="alt-link" id="searchLink2">본문 검색·복사가 필요하면 문서 보기 →</a>
      </div>
    </div>

    <div class="wz-spreads-head" id="spreadsHead">전체 페이지</div>
    <div class="wz-spreads" id="spreads"></div>
  </section>

  <!-- ===== ② 읽기 모드 (페이지 단위) ===== -->
  <div id="flipView" hidden>
    <div class="topbar v-top">
      <button class="btn icon-btn" id="closeFlip" title="미리보기로">←</button>
      <img class="bar-logo" src="assets/eastar_logo.svg" alt="이스타항공" />
      <span class="title" id="flipTitle"></span>
      <div class="spacer"></div>
      <div class="seg" id="modeSeg" title="보기 방식">
        <button data-m="single" class="active">1장</button>
        <button data-m="spread">2장</button>
        <button data-m="scroll">스크롤</button>
      </div>
      <button class="btn icon-btn" id="zoomOut" title="축소">－</button>
      <button class="btn" id="fitBtn" title="화면 맞춤"><span id="zoomLabel">100%</span></button>
      <button class="btn icon-btn" id="zoomIn" title="확대">＋</button>
      <a class="btn icon-btn" id="searchLink3" title="문서 검색·복사 보기">🔍</a>
      <button class="btn icon-btn" id="dlBtn2" title="PDF 다운로드">⬇</button>
      <button class="btn icon-btn" id="fsBtn" title="전체화면">⛶</button>
      <button class="btn icon-btn" id="panelBtn" title="페이지 목록">☰</button>
    </div>

    <div id="stage"><div id="pages" class="pages one"></div></div>

    <div class="v-bottom">
      <button class="btn icon-btn" id="prevBtn" title="이전">◀</button>
      <input type="range" id="slider" min="1" max="1" value="1" />
      <span id="pageInfo">- / -</span>
      <button class="btn icon-btn" id="nextBtn" title="다음">▶</button>
    </div>
  </div>

  <!-- 사이드 패널 (페이지 썸네일) -->
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="side-head">
      <div class="tabs"><div class="tab active">페이지</div></div>
      <div class="spacer" style="flex:1"></div>
      <button class="btn icon-btn" id="closeSide">✕</button>
    </div>
    <div class="side-body"><div id="sideThumbs" class="thumbs"></div></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="books.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); };

    // ---------- 책 선택 ----------
    const params = new URLSearchParams(location.search);
    const book = (window.BOOKS || []).find(b => b.id === params.get('book'));
    if (!book || book.type !== 'pdf') {
      document.body.innerHTML = '<div class="empty-state" style="margin-top:120px"><h2>문서를 찾을 수 없습니다</h2><p><a class="btn" href="index.html">← 목록으로</a></p></div>';
      throw new Error('no book');
    }
    document.title = `${book.title} — 이스타항공`;
    $('bookTitle').textContent = book.title;
    $('flipTitle').textContent = book.title;
    $('titleBig').textContent = book.title;
    $('subBig').textContent = book.subtitle || '';
    $('coverImg').src = book.cover;
    const pdfUrl = `${book.path}/${book.file}`;
    const searchHref = `pdf.html?book=${encodeURIComponent(book.id)}`;
    $('searchLink').href = searchHref;
    $('searchLink2').href = searchHref;
    $('searchLink3').href = searchHref;

    // 카테고리 목록에서 #read 로 진입하면 랜딩(페이지 목록)을 건너뛰고 바로 뷰어로.
    // 로딩 중 랜딩이 잠깐 보이는 깜빡임을 막기 위해 즉시 숨김.
    const directRead = location.hash === '#read';
    if (directRead) {
      $('landing').style.display = 'none';
      $('flipView').hidden = false;
      $('flipTitle').textContent = book.title;
      $('pages').innerHTML = '<div style="color:#8aa0bd;width:100%;text-align:center;padding-top:120px;font-size:15px">불러오는 중…</div>';
    }

    function download() { const a = document.createElement('a'); a.href = pdfUrl; a.download = `${book.title}.pdf`; document.body.appendChild(a); a.click(); a.remove(); }
    $('dlBtn1').onclick = download; $('dlBtn2').onclick = download;
    // 다운로드는 관리자에게만 노출 (일반 방문자는 읽기 전용)
    if (localStorage.getItem('eb_admin') !== '1') { $('dlBtn1').style.display = 'none'; $('dlBtn2').style.display = 'none'; }

    // ---------- PDF.js ----------
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let pdf = null, numPages = 0, baseW = 0, baseH = 0, RATIO = 1.414;
    const thumbCache = {};
    const fullCache = new Map();
    const FULL_CACHE_MAX = 28;
    let curPageW = 480;       // 현재 페이지 렌더 폭(px) — 해상도 결정

    async function renderToUrl(n, scale, quality) {
      const page = await pdf.getPage(n);
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d', { alpha: false });
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      return c.toDataURL('image/jpeg', quality);
    }
    async function fullUrl(n) {
      if (fullCache.has(n)) { const u = fullCache.get(n); fullCache.delete(n); fullCache.set(n, u); return u; }
      const targetW = Math.min(2600, Math.round(curPageW * 3));   // 맞춤폭의 3배로 렌더 → 확대해도 선명
      const url = await renderToUrl(n, targetW / baseW, 0.85);
      fullCache.set(n, url);
      while (fullCache.size > FULL_CACHE_MAX) fullCache.delete(fullCache.keys().next().value);
      return url;
    }

    // ---------- 초기 로딩 ----------
    (async () => {
      try {
        pdf = await pdfjsLib.getDocument({ url: pdfUrl, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true }).promise;
        numPages = pdf.numPages;
        const p1 = await pdf.getPage(1);
        const vp = p1.getViewport({ scale: 1 });
        baseW = vp.width; baseH = vp.height; RATIO = baseH / baseW;
        $('spreadsHead').textContent = `전체 ${numPages}페이지`;
        $('slider').max = numPages;
        buildThumbs();
        if (location.hash === '#read') openReader(1);
      } catch (e) {
        const isFile = location.protocol === 'file:';
        // 바로읽기로 진입해 랜딩을 숨겼다면, 오류 안내를 보이도록 되돌림
        $('flipView').hidden = true;
        $('landing').style.display = 'flex';
        $('landing').innerHTML = `<div class="empty-state" style="margin-top:90px">
          <h2>간행물을 불러오지 못했습니다</h2>
          ${isFile
            ? `<p>파일을 더블클릭(<code>file://</code>)으로 열면 브라우저 보안 정책상 PDF를 읽지 못합니다.<br>
               같은 폴더의 <b>「미리보기.bat」</b> 을 실행하거나, GitHub Pages 등 웹주소(http/https)로 열면 정상 동작합니다.</p>
               <p style="margin-top:18px"><a class="btn" href="index.html">← 목록으로</a></p>`
            : `<p>${e.message || e}</p><p style="margin-top:18px"><a class="btn" href="index.html">← 목록으로</a></p>`}
        </div>`;
      }
    })();

    // ---------- 미리보기 썸네일(지연 렌더) ----------
    const spreadsEl = $('spreads');
    const tio = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { renderThumb(+e.target.dataset.n, e.target); tio.unobserve(e.target); }
    }), { rootMargin: '400px' });
    const sideTio = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { renderThumb(+e.target.dataset.n, e.target); sideTio.unobserve(e.target); }
    }), { root: null, rootMargin: '300px' });

    function buildThumbs() {
      spreadsEl.innerHTML = '';
      const sideHtml = [];
      for (let n = 1; n <= numPages; n++) {
        const b = document.createElement('button');
        b.className = 'wz-thumb'; b.dataset.n = n;
        b.innerHTML = `<div class="wz-thumb-img"><span>${n}</span></div>`;
        b.onclick = () => openReader(n);
        spreadsEl.appendChild(b);
        tio.observe(b);
        sideHtml.push(`<div class="thumb" data-n="${n}"><div class="wz-thumb-img" style="border:none"><span>${n}</span></div></div>`);
      }
      $('sideThumbs').innerHTML = sideHtml.join('');
      $('sideThumbs').querySelectorAll('.thumb').forEach(el => {
        el.onclick = () => { const n = +el.dataset.n; if (!$('flipView').hidden) jumpTo(n); else openReader(n); closePanel(); };
        sideTio.observe(el);
      });
    }
    async function renderThumb(n, el) {
      try {
        if (!thumbCache[n]) thumbCache[n] = await renderToUrl(n, 200 / baseW, 0.7);
        const box = el.querySelector('.wz-thumb-img');
        box.style.backgroundImage = `url("${thumbCache[n]}")`; box.classList.add('loaded');
      } catch (e) {}
    }

    // ============================================================
    //  읽기 모드 — 페이지 단위 (1장 / 2장)
    // ============================================================
    const pagesEl = $('pages');
    const stageEl = $('stage');
    let mode = localStorage.getItem('eb_pdf_mode');
    mode = (mode === 'spread' || mode === 'scroll') ? mode : 'single';
    let cur = 1;                  // 현재(또는 펼침 왼쪽) 페이지
    let scale = 1, tx = 0, ty = 0;   // 확대 배율 / 이동(px) — 페이지 모드
    let layoutW = 0, layoutH = 0;    // 맞춤(배율1)일 때 콘텐츠 크기
    const MIN_SCALE = 1, MAX_SCALE = 4;
    // 스크롤(연속) 모드 상태
    let scrollScale = 1, scrollPageW = 0, scrollIO = null;
    const scrollWraps = [], scrollRendered = new Set(), scrollCache = new Map();
    const SCROLL_CACHE_MAX = 16;

    function pageList() {
      if (mode === 'single') return [cur];
      const left = (cur % 2 === 1) ? cur : cur - 1;   // 펼침: 홀수가 왼쪽
      cur = Math.max(1, left);
      return (cur + 1 <= numPages) ? [cur, cur + 1] : [cur];
    }

    function fitSize() {
      const sw = stageEl.clientWidth, sh = stageEl.clientHeight;
      const pad = 22, gap = 14;
      let w, h;
      if (mode === 'single') {
        h = sh - pad; w = h / RATIO;
        if (w > sw - pad) { w = sw - pad; h = w * RATIO; }
      } else {
        w = (sw - pad - gap) / 2; h = w * RATIO;
        if (h > sh - pad) { h = sh - pad; w = h / RATIO; }
      }
      return { w: Math.max(100, Math.floor(w)), h: Math.floor(h), gap };
    }

    function render(resetView = true) {
      if (!numPages) return;
      if (mode === 'scroll') { renderScroll(); return; }
      renderPaged(resetView);
    }
    function renderPaged(resetView = true) {
      stageEl.classList.remove('scroll-mode');
      if (scrollIO) { scrollIO.disconnect(); scrollIO = null; }
      const { w, h, gap } = fitSize();
      curPageW = w;
      const list = pageList();
      layoutW = list.length === 2 ? (w * 2 + gap) : w;
      layoutH = h;
      pagesEl.className = 'pages ' + (mode === 'spread' ? 'two' : 'one');
      pagesEl.style.width = layoutW + 'px';
      pagesEl.style.height = layoutH + 'px';
      pagesEl.innerHTML = list.map(n =>
        `<div class="rpage" data-n="${n}" style="width:${w}px;height:${h}px"><div class="page-skel">${n}</div><img class="pimg" alt="${n}페이지"></div>`
      ).join('');
      pagesEl.querySelectorAll('.rpage').forEach(loadInto);
      prefetch(list);
      if (resetView) { scale = 1; tx = 0; ty = 0; }
      applyTransform();
      updateBar(list);
    }

    function clampPan() {
      const sw = stageEl.clientWidth, sh = stageEl.clientHeight;
      const maxX = Math.max(0, (layoutW * scale - sw) / 2 + 6);
      const maxY = Math.max(0, (layoutH * scale - sh) / 2 + 6);
      tx = Math.min(maxX, Math.max(-maxX, tx));
      ty = Math.min(maxY, Math.max(-maxY, ty));
    }
    function applyTransform() {
      if (scale <= 1.01) scale = 1;
      clampPan();
      pagesEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      stageEl.classList.toggle('zoomed', scale > 1.01);
      const zl = $('zoomLabel'); if (zl) zl.textContent = Math.round(scale * 100) + '%';
    }

    async function loadInto(div) {
      const n = +div.dataset.n;
      try {
        const url = await fullUrl(n);
        const img = div.querySelector('.pimg');
        img.onload = () => div.classList.add('ready');
        img.src = url;
      } catch (e) {}
    }
    function prefetch(list) {
      const around = [];
      const step = mode === 'spread' ? 2 : 1;
      for (let k = 1; k <= 2; k++) { around.push(list[0] - k * step, list[list.length - 1] + k * step); }
      around.forEach(n => { if (n >= 1 && n <= numPages) fullUrl(n).catch(() => {}); });
    }

    function updateBar(list) {
      const total = numPages;
      $('slider').value = cur;
      $('pageInfo').textContent = (list.length === 2 ? `${list[0]}-${list[1]}` : `${cur}`) + ` / ${total}`;
      $('prevBtn').disabled = cur <= 1;
      $('nextBtn').disabled = cur >= total;
    }

    // ----- 스크롤(연속/웹툰) 모드 -----
    function renderScroll() {
      stageEl.classList.remove('zoomed');
      stageEl.classList.add('scroll-mode');
      pagesEl.style.transform = 'none';
      pagesEl.className = 'pages scroll';
      const avail = Math.min(stageEl.clientWidth - 20, 900);
      const w = Math.max(120, Math.round(avail * scrollScale));
      scrollPageW = w;
      pagesEl.style.width = w + 'px';
      pagesEl.style.height = '';
      if (scrollIO) scrollIO.disconnect();
      scrollIO = new IntersectionObserver(es => es.forEach(en => {
        const n = +en.target.dataset.n;
        if (en.isIntersecting) renderScrollPage(n); else unloadScrollPage(n);
      }), { root: stageEl, rootMargin: '1400px 0px' });
      scrollWraps.length = 0; scrollRendered.clear();
      pagesEl.innerHTML = '';
      for (let n = 1; n <= numPages; n++) {
        const d = document.createElement('div');
        d.className = 'spage'; d.dataset.n = n;
        d.style.width = w + 'px'; d.style.height = Math.round(w * RATIO) + 'px';
        d.innerHTML = `<div class="page-skel">${n}</div><img class="pimg" alt="${n}">`;
        pagesEl.appendChild(d); scrollWraps.push(d); scrollIO.observe(d);
      }
      const zl = $('zoomLabel'); if (zl) zl.textContent = Math.round(scrollScale * 100) + '%';
      requestAnimationFrame(() => { if (cur > 1 && scrollWraps[cur - 1]) scrollWraps[cur - 1].scrollIntoView({ block: 'start' }); updateScrollBar(); });
    }
    async function renderScrollPage(n) {
      if (scrollRendered.has(n)) return;
      scrollRendered.add(n);
      const d = scrollWraps[n - 1]; if (!d) return;
      try {
        const page = await pdf.getPage(n);
        const vp0 = page.getViewport({ scale: 1 });
        d.style.height = Math.round(scrollPageW * (vp0.height / vp0.width)) + 'px';
        let url = scrollCache.get(n);
        if (!url) {
          const targetW = Math.min(2000, Math.round(scrollPageW * 2));
          url = await renderToUrl(n, targetW / vp0.width, 0.82);
          scrollCache.set(n, url);
          while (scrollCache.size > SCROLL_CACHE_MAX) scrollCache.delete(scrollCache.keys().next().value);
        }
        const img = d.querySelector('.pimg');
        if (img) { img.onload = () => d.classList.add('ready'); img.src = url; }
      } catch (e) { scrollRendered.delete(n); }
    }
    function unloadScrollPage(n) {
      if (!scrollRendered.has(n)) return;
      scrollRendered.delete(n);
      const d = scrollWraps[n - 1]; if (!d) return;
      d.classList.remove('ready'); const img = d.querySelector('.pimg'); if (img) img.removeAttribute('src');
    }
    function updateScrollBar() {
      $('slider').value = cur;
      $('pageInfo').textContent = `${cur} / ${numPages}`;
      $('prevBtn').disabled = cur <= 1; $('nextBtn').disabled = cur >= numPages;
    }
    function updateScrollCur() {
      if (mode !== 'scroll' || !scrollWraps.length) return;
      const mid = stageEl.scrollTop + stageEl.clientHeight * 0.4;
      let acc = 0, p = 1;
      for (let i = 0; i < scrollWraps.length; i++) {
        const h = scrollWraps[i].offsetHeight + 8;
        if (acc + h > mid) { p = i + 1; break; }
        acc += h; p = i + 1;
      }
      if (p !== cur) { cur = p; updateScrollBar(); }
    }
    function setScrollScale(s) {
      s = Math.max(0.5, Math.min(3, Math.round(s * 100) / 100));
      if (s === scrollScale) return;
      const anchor = cur;
      scrollScale = s; scrollCache.clear(); renderScroll();
      requestAnimationFrame(() => { if (scrollWraps[anchor - 1]) scrollWraps[anchor - 1].scrollIntoView({ block: 'start' }); });
    }
    let scrollRaf;
    stageEl.addEventListener('scroll', () => { if (mode === 'scroll') { cancelAnimationFrame(scrollRaf); scrollRaf = requestAnimationFrame(updateScrollCur); } }, { passive: true });

    // 페이지 넘김 (확대 배율 유지, 새 페이지는 위쪽부터)
    function go(dir) {
      const step = mode === 'spread' ? 2 : 1;
      const n = Math.max(1, Math.min(numPages, cur + dir * step));
      if (n === cur) return;
      jumpTo(n);
    }
    function jumpTo(n) {
      n = Math.max(1, Math.min(numPages, n | 0));
      cur = n;
      if (mode === 'scroll') {
        if (scrollWraps[n - 1]) scrollWraps[n - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
        updateScrollBar();
        return;
      }
      const kept = scale;
      render(false);
      if (kept > 1.01) { tx = 0; ty = 1e9; applyTransform(); }   // 위쪽 정렬
    }
    $('prevBtn').onclick = () => go(-1);
    $('nextBtn').onclick = () => go(1);
    $('slider').oninput = e => jumpTo(+e.target.value);

    // 확대/축소 (focal 기준)
    const CENTER = { x: 0, y: 0 };
    function zoomTo(focal, ns) {
      ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, ns));
      if (Math.abs(ns - scale) < 0.001) return;
      tx = focal.x - (focal.x - tx) * (ns / scale);
      ty = focal.y - (focal.y - ty) * (ns / scale);
      scale = ns;
      if (scale <= 1.01) { scale = 1; tx = 0; ty = 0; }
      applyTransform();
    }
    $('zoomIn').onclick = () => mode === 'scroll' ? setScrollScale(scrollScale * 1.2) : zoomTo(CENTER, scale * 1.35);
    $('zoomOut').onclick = () => mode === 'scroll' ? setScrollScale(scrollScale / 1.2) : zoomTo(CENTER, scale / 1.35);
    $('fitBtn').onclick = () => { if (mode === 'scroll') setScrollScale(1); else { scale = 1; tx = 0; ty = 0; applyTransform(); } };

    // 보기 방식 토글
    function applyMode(m) {
      mode = m; localStorage.setItem('eb_pdf_mode', m);
      $('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.m === m));
      fullCache.clear(); render();
    }
    $('modeSeg').querySelectorAll('button').forEach(b => b.onclick = () => applyMode(b.dataset.m));

    // 진입/이탈
    function openReader(startPage = 1) {
      cur = Math.max(1, Math.min(numPages, startPage | 0));
      scale = 1; tx = 0; ty = 0;
      $('landing').style.display = 'none';
      $('flipView').hidden = false;
      $('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.m === mode));
      requestAnimationFrame(() => render(true));
      if (!sessionStorage.getItem('eb_reader_hint')) {
        sessionStorage.setItem('eb_reader_hint', '1');
        setTimeout(() => toast('확대: 핀치·더블탭·＋ · 끌어서 이동  |  상단 「스크롤」로 연속(웹툰) 보기'), 500);
      }
    }
    // 랜딩(페이지 목록) 단계를 건너뛰므로, 뷰어의 뒤로가기는 해당 카테고리 목록으로 이동.
    // (랜딩으로 직접 들어온 경우엔 랜딩으로 복귀)
    function closeReader() {
      if (directRead) { location.href = 'index.html#' + (book.category || ''); }
      else { $('flipView').hidden = true; $('landing').style.display = 'flex'; }
    }
    $('playBtn').onclick = () => openReader(1);
    $('openFlip').onclick = () => openReader(1);
    $('closeFlip').onclick = closeReader;

    // ----- 제스처: 팬 / 핀치 / 더블탭 / 스와이프 -----
    const pointers = new Map();
    let pinch = null, panStart = null, downInfo = null, lastTap = 0;
    function centerOffset(cx, cy) {
      const r = stageEl.getBoundingClientRect();
      return { x: cx - (r.left + r.width / 2), y: cy - (r.top + r.height / 2) };
    }
    stageEl.addEventListener('pointerdown', e => {
      if ($('flipView').hidden || mode === 'scroll') return;
      try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const p = [...pointers.values()];
        pinch = { dist: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), scale: scale,
                  focal: centerOffset((p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2), tx, ty };
        panStart = null; downInfo = null;
      } else if (pointers.size === 1) {
        panStart = { x: e.clientX, y: e.clientY, tx, ty };
        downInfo = { x: e.clientX, y: e.clientY, moved: false };
      }
    });
    stageEl.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pointers.size >= 2) {
        const p = [...pointers.values()];
        const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        const ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinch.scale * (dist / pinch.dist)));
        tx = pinch.focal.x - (pinch.focal.x - pinch.tx) * (ns / pinch.scale);
        ty = pinch.focal.y - (pinch.focal.y - pinch.ty) * (ns / pinch.scale);
        scale = ns; applyTransform(); e.preventDefault();
      } else if (panStart && pointers.size === 1) {
        const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
        if (Math.abs(dx) + Math.abs(dy) > 6 && downInfo) downInfo.moved = true;
        if (scale > 1.01) { tx = panStart.tx + dx; ty = panStart.ty + dy; applyTransform(); e.preventDefault(); }
      }
    });
    function endPointer(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (pointers.size === 1) {
        // 핀치 후 한 손가락 남으면 이어서 팬
        const pt = [...pointers.values()][0];
        panStart = { x: pt.x, y: pt.y, tx, ty };
        downInfo = { x: pt.x, y: pt.y, moved: true };
      } else if (pointers.size === 0) {
        if (downInfo && !downInfo.moved) {              // 탭 → 더블탭 검사
          const now = e.timeStamp;
          if (now - lastTap < 300) { lastTap = 0; zoomTo(centerOffset(e.clientX, e.clientY), scale > 1.01 ? 1 : 2.4); }
          else lastTap = now;
        } else if (downInfo && scale <= 1.01) {         // 맞춤 상태에서 명확한 수평 스와이프만 넘김
          const dx = e.clientX - downInfo.x, dy = e.clientY - downInfo.y;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
        }
        panStart = null; downInfo = null;
      }
    }
    stageEl.addEventListener('pointerup', endPointer);
    stageEl.addEventListener('pointercancel', endPointer);

    // 휠: Ctrl(⌘)+휠 확대, 확대 중 휠로 상하·좌우 이동
    stageEl.addEventListener('wheel', e => {
      if ($('flipView').hidden || mode === 'scroll') return;   // 스크롤 모드는 기본 스크롤
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomTo(centerOffset(e.clientX, e.clientY), scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)); }
      else if (scale > 1.01) { e.preventDefault(); tx -= e.deltaX; ty -= e.deltaY; applyTransform(); }
    }, { passive: false });

    // 키보드
    document.addEventListener('keydown', e => {
      if ($('flipView').hidden || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
      else if (e.key === '+' || e.key === '=') zoomTo(CENTER, scale * 1.35);
      else if (e.key === '-' || e.key === '_') zoomTo(CENTER, scale / 1.35);
      else if (e.key === '0') { scale = 1; tx = 0; ty = 0; applyTransform(); }
      else if (e.key === 'Escape') { if ($('side').classList.contains('open')) closePanel(); else closeReader(); }
    });

    $('fsBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

    // 사이드 패널
    const side = $('side'), scrim = $('scrim');
    function openPanel() { side.classList.add('open'); scrim.classList.add('show'); }
    function closePanel() { side.classList.remove('open'); scrim.classList.remove('show'); }
    $('panelBtn').onclick = openPanel; $('closeSide').onclick = closePanel; scrim.onclick = closePanel;

    // 리사이즈 — 맞춤 크기 재계산 후 다시 그림
    let rT;
    window.addEventListener('resize', () => {
      clearTimeout(rT);
      rT = setTimeout(() => { if (!$('flipView').hidden) { fullCache.clear(); render(true); } }, 200);
    });
  </script>
