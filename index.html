<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이스타항공 대외 간행물 e-Book</title>
  <meta name="description" content="이스타항공 대외 간행물을 웹진으로 읽는 e-Book" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="assets/style.css?v=20260622g" />
</head>
<body>
  <!-- ===== 로딩 스플래시 (진입 시 3초, 이스타항공 사진 랜덤 표출) ===== -->
  <div class="splash" id="splash">
    <div class="splash-bg" id="splashBg"></div>
    <div class="splash-scrim"></div>
    <div class="splash-inner">
      <img class="splash-logo" src="assets/eastar_logo.svg" alt="이스타항공" />
      <div class="splash-title"><span class="t-desktop">EASTARJET</span><span class="t-mobile">EASTARJET</span></div>
      <div class="splash-bar"><span id="splashBarFill"></span></div>
    </div>
    <button class="splash-skip" id="splashSkip">건너뛰기 ✕</button>
  </div>

  <!-- ===== 상단 브랜드 바 ===== -->
  <div class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/eastar_logo.svg" alt="이스타항공" />
    </a>
    <span class="brand-divider"></span>
    <nav class="topnav">
      <a class="topnav-link active" id="brandTitle" href="index.html" aria-current="page">E-Books</a>
      <a class="topnav-link" id="shopBrand" href="shop.html">Eastar SHOP</a>
    </nav>
    <div class="spacer"></div>
  </div>

  <!-- ===== 공지 배너 (books.js 의 NOTICE — 관리자 콘솔에서 편집) ===== -->
  <div class="notice-banner" id="noticeBanner" style="display:none">
    <span class="notice-ico">📢</span>
    <span id="noticeText"></span>
    <a id="noticeLink" target="_blank" rel="noopener" style="display:none">자세히 ›</a>
    <button id="noticeClose" aria-label="공지 닫기">✕</button>
  </div>

  <!-- ===== 메인: 카테고리 선택 ===== -->
  <section class="hero">
    <h1 id="heroTitle">대외 간행물</h1>
    <p id="heroSubtitle">카테고리를 선택하면 간행물을 웹진 형태로 열람할 수 있습니다.</p>
  </section>

  <main class="cat-grid" id="catGrid"></main>

  <!-- ===== 지금 핫한 책 (이번 달 열람수 기준 — /api/track-stats) ===== -->
  <section class="hot-shelf" id="hotShelf" style="display:none">
    <div class="hot-head">
      <h2>🔥 지금 핫한 책</h2>
      <span class="hot-sub">이번 달 다른 독자들이 가장 많이 읽고 있어요</span>
    </div>
    <div class="hot-row" id="hotRow"></div>
  </section>

  <!-- ===== 카테고리 상세: 간행물 목록(웹진) ===== -->
  <main class="cat-detail" id="catDetail" style="display:none">
    <button class="back-btn" id="backBtn">← 카테고리</button>
    <div class="cat-detail-head">
      <h2 id="detailTitle"></h2>
      <p id="detailDesc"></p>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <h2>🛫 준비 중입니다</h2>
      <p>이 카테고리의 간행물이 곧 등록될 예정입니다.</p>
    </div>
  </main>

  <footer class="site">© EASTAR JET — 대외 간행물 e-Book. 무단 전재·재배포 금지. <a href="admin.html" class="admin-link">관리자</a></footer>

  <script src="books.js"></script>
  <script src="products.js"></script>
  <script src="assets/track.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const today = new Date().toISOString().slice(0, 10);
    // 공개 조건: published !== false 이고, 게시 예약일(publishAt)이 지났을 것
    const isVisible = b => b.published !== false && (!b.publishAt || b.publishAt <= today);
    // 발행일(date)로부터 30일간 NEW 뱃지
    const isNew = b => b.date && (Date.now() - new Date(b.date + 'T00:00:00').getTime()) <= 30 * 86400000;
    const books = (window.BOOKS || []).filter(isVisible);
    const categories = (window.CATEGORIES || []);
    const loadingImages = (window.LOADING_IMAGES || []);

    /* ---------- 메인 상단 문구(관리자 콘솔에서 편집) ---------- */
    (function siteInit() {
      const s = window.SITE || {};
      if (s.brandTitle) $('brandTitle').textContent = s.brandTitle;
      if (s.heroTitle) $('heroTitle').textContent = s.heroTitle;
      if (s.heroSubtitle) $('heroSubtitle').textContent = s.heroSubtitle;
      // SHOP 제목(products.js)을 'Eastar SHOP' 탭에 반영 — shop-admin에서 변경 시 메인에도 동일 반영
      const shop = window.SHOP || {};
      if (shop.title) $('shopBrand').textContent = shop.title;
    })();

    if (window.ebTrack) ebTrack.visit();

    /* ---------- 공지 배너 ---------- */
    (function noticeInit() {
      const n = window.NOTICE || {};
      if (!n.enabled || !n.text) return;
      if (n.until && n.until < today) return;
      const dismissKey = 'eb_notice_' + n.text.slice(0, 40);   // 내용이 바뀌면 다시 표시
      try { if (localStorage.getItem(dismissKey)) return; } catch (e) {}
      $('noticeText').textContent = n.text;
      if (n.link) { $('noticeLink').href = n.link; $('noticeLink').style.display = 'inline'; }
      $('noticeBanner').style.display = 'flex';
      $('noticeClose').onclick = () => {
        $('noticeBanner').style.display = 'none';
        try { localStorage.setItem(dismissKey, '1'); } catch (e) {}
      };
    })();

    /* ---------- ① 로딩 스플래시 ---------- */
    (function splashInit() {
      const splash = $('splash');
      if (!loadingImages.length) { splash.remove(); return; }

      const bg = $('splashBg');
      // 진입할 때마다 무작위로 1장 선택해 2초간 그대로 유지
      const pick = loadingImages[Math.floor(Math.random() * loadingImages.length)];
      const layer = document.createElement('div');
      layer.className = 'splash-img';
      layer.style.backgroundImage = `url("${pick}")`;
      bg.appendChild(layer);
      requestAnimationFrame(() => layer.classList.add('on'));

      const DURATION = 1300;
      $('splashBarFill').style.transitionDuration = DURATION + 'ms';
      requestAnimationFrame(() => $('splashBarFill').style.width = '100%');

      let done = false;
      function finish() {
        if (done) return; done = true;
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 650);
      }
      const timer = setTimeout(finish, DURATION);
      $('splashSkip').onclick = () => { clearTimeout(timer); finish(); };
    })();

    /* ---------- ② 카테고리 카드 ---------- */
    function countIn(catId) { return books.filter(b => b.category === catId).length; }

    // 카테고리 표지 우선순위:
    //  ① coverBook(특정 PDF로 표지 고정)이 있으면 그 간행물 표지
    //  ② 없으면 그 카테고리 '최신본'(목록 맨 끝 공개 간행물) 표지를 자동 사용
    //  ③ 간행물이 없으면 카테고리에 지정된 표지(c.cover)
    function catCover(c) {
      const list = books.filter(b => b.category === c.id);
      if (c.coverBook) {
        const pin = list.find(b => b.id === c.coverBook);
        if (pin && pin.cover) return pin.cover;
      }
      const latest = list.length ? list[list.length - 1] : null;
      return (latest && latest.cover) ? latest.cover : c.cover;
    }

    // eastarjet.com 계열 도메인에서만 외부 페이지를 iframe 으로 임베드 가능
    // (ESG 페이지 보안정책: frame-ancestors https://*.eastarjet.com/).
    // 그 외(pages.dev 등)에서는 외부 페이지로 바로 이동한다.
    const canEmbed = /\.eastarjet\.com$/i.test(location.hostname);

    // 사진형 표지: 파일명(img_safety_01-… 등)으로 ESG 분류와 세부 주제를 찾는다.
    // 주제는 main.eastarjet.com/esg 의 항목 제목과 동일하게 맞춤.
    const ESG_GROUPS = { safety: '안전경영', environment: '환경경영', society: '사회경영' };
    const ESG_TOPICS = {
      'safety-01': '항공 의료 안전 시스템 강화',
      'safety-02': '현장 근로자 온열질환 예방',
      'safety-03': '객실승무원 실전형 체력검정 도입',
      'environment-01': '임직원 나무심기 행사',
      'environment-02': '친환경 항공기 도입을 통한 기후변화 대응',
      'society-01': '고귀한 생명 나눔 지원',
      'society-02': '생명 존중 유기견 봉사활동',
      'society-03': "장애인 축구단 '이스타항공 제우스' 운영",
      'society-04': '고려인 동포 지원 및 글로벌 상생',
      'society-05': '대한민국 국군 장병 지원',
      'society-06': '항공 전문 인재 양성 산학협력'
    };
    function coverInfo(url) {
      const m = String(url).match(/img_(safety|environment|society)_(\d+)/i);
      if (!m) return null;
      const cat = m[1].toLowerCase();
      return { group: ESG_GROUPS[cat] || '', topic: ESG_TOPICS[cat + '-' + m[2]] || '' };
    }

    $('catGrid').innerHTML = categories.map(c => {
      const href = c.external ? c.external : `#${c.id}`;
      const badge = c.external ? '바로가기 ↗' : `${countIn(c.id)}종`;
      // covers 배열이 있으면 진입할 때마다 무작위 1장 + 그 사진의 주제 제목을 표지 위에 표시
      const hasCovers = Array.isArray(c.covers) && c.covers.length;
      const coverUrl = hasCovers ? c.covers[Math.floor(Math.random() * c.covers.length)] : catCover(c);
      const info = hasCovers ? coverInfo(coverUrl) : null;
      const cap = info ? `
          <span class="cat-cover-cap">
            ${info.topic ? `<span class="cap-topic">${info.topic}</span>` : ''}
            ${info.group ? `<span class="cap-group">${info.group}</span>` : ''}
          </span>` : '';
      return `
      <a class="cat-card${hasCovers ? ' cat-card--photo' : ''}" data-cat="${c.id}" href="${href}">
        <span class="cat-count">${badge}</span>
        <div class="cat-body">
          <h3>${c.title}</h3>
          <p>${c.desc || ''}</p>
          <span class="cat-go">살펴보기 ›</span>
        </div>
        <div class="cat-cover">
          <img src="${coverUrl}" alt="${c.title}" loading="lazy" />
          ${cap}
        </div>
      </a>`;
    }).join('');
    fitCaption(document);   // 표지 주제 제목을 한 줄에 맞게 글자 크기 자동 조정

    /* ---------- ③ 카테고리 상세(웹진 목록) ---------- */
    // 외부 페이지를 catDetail 안에 iframe 으로 표시(ESG 등). canEmbed 일 때만 호출.
    function openEmbed(cat) {
      $('detailTitle').textContent = cat.title;
      $('detailDesc').textContent = cat.desc || '';
      $('shelf').style.display = 'none';
      $('shelf').innerHTML = '';
      $('emptyState').style.display = 'none';
      let frame = $('extFrame');
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'extFrame';
        frame.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
        frame.style.cssText = 'width:100%;height:calc(100vh - 180px);min-height:600px;border:0;border-radius:14px;background:#fff;';
        $('catDetail').appendChild(frame);
      }
      if (frame.dataset.src !== cat.external) { frame.src = cat.external; frame.dataset.src = cat.external; }
      frame.style.display = 'block';
      $('catGrid').style.display = 'none';
      document.querySelector('.hero').style.display = 'none';
      $('hotShelf').style.display = 'none';
      $('catDetail').style.display = 'block';
      window.scrollTo(0, 0);
    }
    function hideEmbed() { const f = $('extFrame'); if (f) f.style.display = 'none'; }

    function openCategory(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;

      // 외부 페이지 카테고리(ESG): eastarjet.com 계열이면 iframe 임베드, 아니면 외부로 이동
      if (cat.external) {
        if (canEmbed) return openEmbed(cat);
        location.href = cat.external;
        return;
      }
      hideEmbed();
      const list = books.filter(b => b.category === catId);

      $('detailTitle').textContent = cat.title;
      $('detailDesc').textContent = cat.desc || '';

      const shelf = $('shelf'), empty = $('emptyState');
      if (!list.length) {
        shelf.style.display = 'none';
        shelf.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        shelf.style.display = 'grid';
        shelf.innerHTML = list.map(b => {
          const isPdf = b.type === 'pdf';
          // PDF는 바로 읽기 뷰어로 진입(#read) — 페이지 목록(랜딩) 단계 생략
          const href = isPdf
            ? 'flip.html?book=' + encodeURIComponent(b.id) + '#read'
            : 'viewer.html?book=' + encodeURIComponent(b.id);
          const count = Array.isArray(b.pages) ? ` · ${b.pages.length}p` : '';
          return `
          <a class="book-card" href="${href}">
            <div class="cover-wrap">
              ${isNew(b) ? '<span class="badge badge-new">NEW</span>' : ''}
              <span class="badge badge-type">${isPdf ? 'PDF' : '웹진'}</span>
              <img src="${b.cover}" alt="${b.title} 표지" loading="lazy" />
            </div>
            <div class="book-info">
              <h3>${b.title}</h3>
              <div class="meta">${b.subtitle || ''}${count}</div>
            </div>
            <span class="book-chevron" aria-hidden="true">›</span>
          </a>`;
        }).join('');
      }

      $('catGrid').style.display = 'none';
      document.querySelector('.hero').style.display = 'none';
      $('hotShelf').style.display = 'none';
      $('catDetail').style.display = 'block';
      fitTitles(shelf);            // 컨테이너 표시 후라야 폭이 잡혀 한 줄 맞춤이 동작
      window.scrollTo(0, 0);
    }

    /* 카드 제목이 길어도 한 줄로 — 글자 크기는 그대로 두고 자간만 좁혀 카드 폭에 맞춘다 */
    function fitTitles(scope) {
      scope.querySelectorAll('.book-card h3').forEach(h => {
        h.style.fontSize = '';        // 다른 제목과 동일한 글자 크기 유지
        h.style.letterSpacing = '';
        if (!h.clientWidth) return;
        if (h.scrollWidth <= h.clientWidth) return;     // 이미 한 줄이면 그대로
        let ls = -0.01, guard = 0;                      // CSS 기본 자간(-.01em)에서 시작
        while (h.scrollWidth > h.clientWidth && ls > -0.2 && guard++ < 80) {
          ls -= 0.005; h.style.letterSpacing = ls.toFixed(3) + 'em';
        }
      });
    }
    // 표지 주제 제목(.cap-topic)을 한 줄로 유지 — 폭을 넘으면 글자 크기를 줄여 맞춘다
    function fitCaption(scope) {
      scope.querySelectorAll('.cat-cover-cap').forEach(cap => {
        const topic = cap.querySelector('.cap-topic');
        if (!topic) return;
        const cs = getComputedStyle(cap);
        const avail = cap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        if (avail <= 0) return;                 // 숨겨진(모바일) 경우 건너뜀
        let fs = 18; topic.style.fontSize = fs + 'px';
        let guard = 0;
        while (topic.scrollWidth > avail && fs > 11 && guard++ < 60) {
          fs -= 0.5; topic.style.fontSize = fs + 'px';
        }
      });
    }

    // 글꼴 로드 완료/창 크기 변경 후 다시 맞춤
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitTitles(document); fitCaption(document); });
    let _ftT; window.addEventListener('resize', () => { clearTimeout(_ftT); _ftT = setTimeout(() => { fitTitles(document); fitCaption(document); }, 150); });

    function showHome() {
      hideEmbed();
      $('catDetail').style.display = 'none';
      $('catGrid').style.display = 'grid';
      document.querySelector('.hero').style.display = 'block';
      if (hotReady) $('hotShelf').style.display = 'block';
    }

    /* ---------- 지금 핫한 책 (이번 달 열람수 — /api/track-stats) ---------- */
    const API_BASE = location.hostname.endsWith('.pages.dev') ? '' : 'https://eastarjet-ebook.pages.dev';
    let hotReady = false;
    async function loadHot() {
      try {
        const r = await fetch(API_BASE + '/api/track-stats');
        const d = await r.json();
        if (!d || !d.ok || !Array.isArray(d.books)) return;
        const byId = {}; books.forEach(b => byId[b.id] = b);   // 공개된 간행물만
        const hot = d.books
          .filter(s => s.opensMonth > 0 && byId[s.id])
          .sort((a, b) => b.opensMonth - a.opensMonth)
          .slice(0, 5);
        if (!hot.length) return;
        $('hotRow').innerHTML = hot.map((s, i) => {
          const b = byId[s.id];
          const href = (b.type === 'pdf')
            ? 'flip.html?book=' + encodeURIComponent(b.id) + '#read'
            : 'viewer.html?book=' + encodeURIComponent(b.id);
          return `
            <a class="hot-card" href="${href}">
              <span class="hot-rank">${i + 1}</span>
              <div class="hot-cover"><img src="${b.cover}" alt="${b.title} 표지" loading="lazy"></div>
              <div class="hot-meta">
                <h3>${b.title}</h3>
                <span class="hot-count">이번 달 ${s.opensMonth}회 열람</span>
              </div>
            </a>`;
        }).join('');
        hotReady = true;
        if (!location.hash) $('hotShelf').style.display = 'block';   // 홈 화면일 때만 노출
      } catch (e) { /* 통계 불가 시 섹션 미표시 */ }
    }

    $('catGrid').querySelectorAll('.cat-card').forEach(el => {
      el.addEventListener('click', e => {
        const cat = categories.find(c => c.id === el.dataset.cat);
        // 임베드 불가 환경의 외부 카테고리는 href(외부 URL)로 그대로 이동시킨다
        if (cat && cat.external && !canEmbed) return;
        e.preventDefault();
        location.hash = el.dataset.cat;
      });
    });
    $('backBtn').onclick = () => { location.hash = ''; };

    /* ---------- 해시 라우팅 (뒤로가기 지원) ---------- */
    function route() {
      const id = location.hash.replace('#', '');
      if (id && categories.some(c => c.id === id)) openCategory(id);
      else showHome();
    }
    window.addEventListener('hashchange', route);
    route();
    loadHot();
  </script>

</body>
