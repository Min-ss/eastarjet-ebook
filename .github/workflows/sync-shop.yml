# Eastar SHOP 자동 동기화 — 자사몰(eastarjetshop.com)의 굿즈를 매일 긁어
# products.js(상품·카테고리)와 shop/ 이미지를 자동 갱신·커밋합니다.
# 여행상품(호텔·액티비티·골프)은 제외. SHOP 제목·히어로·공지 문구는 보존됩니다.
name: sync-shop
on:
  schedule:
    - cron: '0 18 * * *'   # 매일 18:00 UTC (한국시간 03:00)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: sync-shop
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 자사몰 굿즈 동기화 (일시적 오류는 재시도로 자동 복구)
        run: |
          for i in 1 2 3; do
            node scripts/sync-shop.js && exit 0
            echo "시도 ${i}/3 실패 — 30초 후 재시도…"; sleep 30
          done
          echo "::error::자사몰 동기화 3회 모두 실패 (일시적 오류가 아닐 수 있음 — 자사몰 페이지 구조 확인 필요)"
          exit 1
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.js shop
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략";
            exit 0;
          fi
          git commit -m "🛍 자사몰 굿즈 자동 동기화 ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
